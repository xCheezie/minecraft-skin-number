<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Add a pixel-art number to your Minecraft skin. Preview and download your PNG right in your browser.">
<title>Skin Number Studio</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #121913; color: #f1f5e7; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 970px; margin: auto; padding: clamp(22px, 6vw, 70px) 20px; }
  header { margin-bottom: 28px; }
  .tag { color: #bbef83; font: bold .76rem monospace; letter-spacing: .15em; text-transform: uppercase; }
  h1 { font-size: clamp(2.4rem, 7vw, 4.7rem); letter-spacing: -.07em; line-height: .98; margin: 12px 0 15px; }
  p { margin: 0; color: #bac8b7; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .panel { background: #202b21; border: 1px solid #3a4c3b; border-radius: 18px; padding: 22px; }
  h2 { font-size: 1.13rem; margin: 0 0 15px; }
  .drop { display: block; padding: 15px; background: #172119; border: 1px dashed #799575; border-radius: 10px; overflow-wrap: anywhere; }
  .drop.over { border-color: #bbef83; background: #30442b; }
  input[type=file] { width: 100%; margin: 8px 0 0; }
  input, select, button { font: inherit; }
  input::file-selector-button { color: #eff7e9; background: #3b5139; border: 0; border-radius: 5px; padding: 5px 9px; margin-right: 8px; cursor: pointer; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .fields label { display: grid; gap: 5px; }
  input[type=text], input[type=color], select { width: 100%; min-width: 0; height: 41px; background: #121b14; color: #f1f5e7; border: 1px solid #59705a; border-radius: 7px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #bbef83; outline-offset: 3px; }
  .sample { border: 0; background: transparent; padding: 0; margin-top: 9px; color: #bbef83; text-decoration: underline; }
  .download { width: 100%; margin-top: 18px; border: 0; border-radius: 8px; padding: 12px; color: #172315; background: #bbef83; font-weight: 750; }
  .download:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.5em; margin-top: 10px; font-size: .85rem; overflow-wrap: anywhere; }
  #status.error { color: #ffc2ac; }
  .stage { background: #141e17; border-radius: 12px; min-height: 334px; padding: 22px 10px 15px; display: flex; justify-content: center; gap: clamp(8px, 3vw, 30px); align-items: center;
    background-image: linear-gradient(#273729 1px, transparent 1px), linear-gradient(90deg, #273729 1px, transparent 1px); background-size: 18px 18px; }
  figure { margin: 0; text-align: center; width: min(43%, 128px); }
  canvas { image-rendering: pixelated; width: 100%; height: auto; display: block; }
  figcaption { display: inline-block; background: #172119; color: #d4e2cf; padding: 2px 8px; border-radius: 4px; font: .85rem monospace; margin-top: 9px; }
  footer { margin-top: 20px; font-size: .88rem; color: #bac8b7; }
  @media(max-width:650px) { .layout { grid-template-columns: 1fr; } .stage { min-height: 265px; } figure { width: min(39%, 105px); } }
</style>
</head>
<body>
<main>
  <header>
    <div class="tag">Minecraft skin tool</div>
    <h1>Skin Number Studio</h1>
    <p>Put a pixel number on your skin and take it into Minecraft.</p>
  </header>
  <div class="layout">
    <section class="panel" aria-labelledby="editor-title">
      <h2 id="editor-title">Edit your skin</h2>
      <label class="drop" id="drop">Choose or drop a skin PNG
        <input type="file" id="file" accept=".png,image/png" aria-describedby="status">
      </label>
      <button class="sample" id="sample" type="button">Try the sample skin</button>
      <div class="fields">
        <label>Number <input id="number" type="text" inputmode="numeric" maxlength="3" value="27" aria-describedby="status"></label>
        <label>Number color <input id="color" type="color" value="#fff2c9"></label>
        <label>Placement <select id="placement"><option value="front">Chest</option><option value="back">Back</option><option value="both">Chest and back</option></select></label>
        <label>Arm model <select id="model"><option value="classic">Classic / Wide</option><option value="slim">Slim</option></select></label>
      </div>
      <button class="download" id="download" type="button">Download skin PNG</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" aria-labelledby="preview-title">
      <h2 id="preview-title">Live preview</h2>
      <div class="stage">
        <figure><canvas id="front" width="16" height="32" aria-label="Front of edited Minecraft skin"></canvas><figcaption>FRONT</figcaption></figure>
        <figure><canvas id="back" width="16" height="32" aria-label="Back of edited Minecraft skin"></canvas><figcaption>BACK</figcaption></figure>
      </div>
    </section>
  </div>
  <footer>Supports 64 × 64 skins and older 64 × 32 skins. Your PNG stays in your browser.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const font = [
  ['010','101','101','101','010'], ['010','110','010','010','111'],
  ['111','001','111','100','111'], ['111','001','011','001','111'],
  ['101','101','111','001','001'], ['111','100','111','001','111'],
  ['011','100','111','101','111'], ['111','001','010','010','010'],
  ['111','101','111','101','111'], ['111','101','111','001','110']
];
const output = document.createElement('canvas');
let source, name, request = 0, currentNumber = null;

function stamp(number) {
  if (number === '100') {
    return ['10010010','10101101','10101101','10101101','10010010'];
  }
  return font[Number(number[0])].map((row, i) =>
    number.length === 1 ? row : row + '0' + font[Number(number[1])][i]
  );
}

function addNumber(ctx, number, face, hasJacket) {
  const rows = stamp(number);
  const x = (face === 'front' ? 20 : 32) + Math.floor((8 - rows[0].length) / 2);
  const y = 23;
  let layer = 0;
  if (hasJacket) {
    const pixels = ctx.getImageData(x, y + 16, rows[0].length, 5).data;
    if (rows.some((row, j) => [...row].some((pixel, i) =>
      pixel === '1' && pixels[(j * row.length + i) * 4 + 3] > 0
    ))) layer = 16;
  }
  ctx.fillStyle = $('color').value;
  rows.forEach((row, j) => [...row].forEach((pixel, i) => {
    if (pixel === '1') ctx.fillRect(x + i, y + j + layer, 1, 1);
  }));
}

function drawPreview(face) {
  const ctx = $(face).getContext('2d');
  ctx.clearRect(0, 0, 16, 32);
  const back = face === 'back';
  const legacy = output.height === 32;
  const arm = $('model').value === 'slim' && !legacy ? 3 : 4;
  function piece(x, y, w, h, dx, dy, mirror = false) {
    ctx.save();
    if (mirror) { ctx.translate(dx + w, 0); ctx.scale(-1, 1); dx = 0; }
    ctx.drawImage(output, x, y, w, h, dx, dy, w, h);
    ctx.restore();
  }
  piece(back ? 24 : 8, 8, 8, 8, 4, 0);
  piece(back ? 56 : 40, 8, 8, 8, 4, 0);
  piece(back ? 32 : 20, 20, 8, 12, 4, 8);
  const right = back ? 12 : 4 - arm, left = back ? 4 - arm : 12;
  const limbOffset = back ? 8 + arm : 4;
  piece(40 + limbOffset, 20, arm, 12, right, 8);
  piece((legacy ? 40 : 32) + limbOffset, legacy ? 20 : 52, arm, 12, left, 8, legacy);
  piece(back ? 12 : 4, 20, 4, 12, back ? 8 : 4, 20);
  piece((legacy ? 0 : 16) + (back ? 12 : 4), legacy ? 20 : 52, 4, 12, back ? 4 : 8, 20, legacy);
  if (!legacy) {
    piece(back ? 32 : 20, 36, 8, 12, 4, 8);
    piece(40 + limbOffset, 36, arm, 12, right, 8);
    piece(48 + limbOffset, 52, arm, 12, left, 8);
    piece(back ? 12 : 4, 36, 4, 12, back ? 8 : 4, 20);
    piece(back ? 12 : 4, 52, 4, 12, back ? 4 : 8, 20);
  }
}

function status(message, error = false) {
  $('status').textContent = message;
  $('status').classList.toggle('error', error);
}

function render() {
  const raw = $('number').value.trim();
  currentNumber = /^(?:[0-9]{1,2}|100)$/.test(raw) ? String(Number(raw)) : null;
  output.width = 64;
  output.height = source.height;
  const ctx = output.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(source, 0, 0);
  if (currentNumber !== null) {
    const placement = $('placement').value;
    for (const face of ['front', 'back']) {
      if (placement === 'both' || placement === face) addNumber(ctx, currentNumber, face, output.height === 64);
    }
  }
  drawPreview('front');
  drawPreview('back');
  $('download').disabled = currentNumber === null;
  $('number').setAttribute('aria-invalid', String(currentNumber === null));
  status(currentNumber === null ? 'Enter a whole number from 0 to 100.' : name + ' · 64 × ' + source.height, currentNumber === null);
}

async function load(file) {
  const id = ++request;
  try {
    const signature = new Uint8Array(await file.slice(0, 24).arrayBuffer());
    const png = [137,80,78,71,13,10,26,10];
    if (signature.length !== 24 || !png.every((byte, i) => signature[i] === byte)) throw Error('Choose a PNG file.');
    const header = new DataView(signature.buffer);
    if (header.getUint32(16) !== 64 || ![32, 64].includes(header.getUint32(20))) {
      throw Error('Choose a 64 × 64 or 64 × 32 skin PNG.');
    }
    const bitmap = await createImageBitmap(file);
    if (id !== request) { bitmap.close(); return; }
    source.close?.();
    source = bitmap;
    name = file.name;
    render();
  } catch (error) {
    if (id === request) status((error.message || 'Could not open this skin.') + ' The preview still shows ' + name + '.', true);
  }
}

function sample() {
  request++;
  source?.close?.();
  source = document.createElement('canvas');
  source.width = source.height = 64;
  const ctx = source.getContext('2d');
  function cube(x, y, w, d, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x + d, y, w * 2, d);
    ctx.fillRect(x, y + d, 2 * (w + d), h);
  }
  cube(0, 0, 8, 8, 8, '#c98d68');
  cube(16, 16, 8, 4, 12, '#3b694b');
  cube(40, 16, 4, 4, 12, '#3b694b');
  cube(32, 48, 4, 4, 12, '#3b694b');
  cube(0, 16, 4, 4, 12, '#526175');
  cube(16, 48, 4, 4, 12, '#526175');
  ctx.fillStyle = '#4a3228';
  ctx.fillRect(8, 0, 8, 8);
  ctx.fillRect(0, 8, 32, 2);
  ctx.fillRect(9, 12, 2, 1);
  ctx.fillRect(13, 12, 2, 1);
  ctx.fillRect(11, 14, 2, 1);
  ctx.fillStyle = '#c98d68';
  ctx.fillRect(40, 27, 16, 5);
  ctx.fillRect(32, 59, 16, 5);
  ctx.fillStyle = '#292f3a';
  ctx.fillRect(0, 30, 16, 2);
  ctx.fillRect(16, 62, 16, 2);
  $('model').value = 'classic';
  name = 'Sample skin';
  render();
}

$('file').addEventListener('change', event => {
  if (event.target.files[0]) load(event.target.files[0]);
  event.target.value = '';
});
for (const type of ['dragover', 'dragleave', 'drop']) {
  $('drop').addEventListener(type, event => {
    event.preventDefault();
    $('drop').classList.toggle('over', type === 'dragover');
    if (type === 'drop' && event.dataTransfer.files[0]) load(event.dataTransfer.files[0]);
  });
}
for (const id of ['number', 'color', 'placement', 'model']) $(id).addEventListener('input', render);
$('sample').addEventListener('click', sample);
$('download').addEventListener('click', () => {
  if (currentNumber === null) return;
  const filename = name.replace(/\.png$/i, '').replace(/[^a-z0-9_-]+/gi, '-') + '-' + currentNumber + '.png';
  output.toBlob(blob => {
    if (!blob) { status('Could not export the PNG. Try again.', true); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
});
sample();
</script>
</body>
</html>
